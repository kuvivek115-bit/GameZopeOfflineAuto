name: Build Fruity Fiesta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o GameZopeOfflineAuto-FruityFiesta.zip -d project
          cd project
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleRelease --no-daemon

      - name: Sign APK
        working-directory: project
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storepass android \
            -keypass android \
            -alias gamezope \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GameZopeOfflineAuto,O=GameZope,C=IN"

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias gamezope \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameZopeOfflineAuto-FruityFiesta-APK
          path: project/app/build/outputs/apk/release/*.apk
